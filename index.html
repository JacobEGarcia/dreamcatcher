<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreamcatcher - Dream Journal &amp; Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeef4;--ink:#322e47;--dim:#8b86a3;--accent:#6a5fc0;--line:#ddd9e8;--card:#fbfafc}
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(#f2f1f7,#eceaf2);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 16px 64px}
h1{font-family:'Newsreader',Georgia,serif;font-size:36px;font-weight:500;letter-spacing:.3px}
.sub{font-family:'Newsreader',serif;font-style:italic;color:var(--dim);font-size:15px;margin-top:5px}
#stats{margin:22px 0 16px;font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);text-align:center}
#stats b{color:var(--accent);margin:0 3px}
#dream{width:min(560px,94vw);height:110px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-family:'Newsreader',serif;font-size:15.5px;line-height:1.6;color:var(--ink);outline:none;resize:vertical;transition:border .15s,box-shadow .15s}
#dream:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(106,95,192,.13)}
.btnrow{display:flex;gap:8px;margin-top:10px}
button{cursor:pointer;padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.3px;transition:all .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
#catch{background:var(--accent);border-color:var(--accent);color:#fff}
#catch:hover{background:#5a50ad;color:#fff}
#generated{width:min(560px,94vw);margin-top:14px;font-family:'Newsreader',serif;font-style:italic;font-size:16px;line-height:1.65;color:#4a4470}
#generated:not(:empty){background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.sym{display:inline-block;background:#e6e2f5;border:1px solid #d3cdea;border-radius:999px;padding:2px 10px;font-family:'Outfit',sans-serif;font-style:normal;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:2px 4px 2px 0}
#journal{width:min(560px,94vw);margin-top:18px;display:grid;gap:10px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-family:'Newsreader',serif;font-size:15.5px;line-height:1.6}
.entry .when{font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
</style>
</head>
<body>
<h1>Dreamcatcher</h1>
<div class="sub">catch them before they evaporate</div>
<div id="stats"></div>
<textarea id="dream" placeholder="I was back in high school but the halls were an airport..."></textarea>
<div class="btnrow">
<button id="catch">Catch it</button>
<button id="generate">Generate a dream</button>
</div>
<div id="generated"></div>
<div id="journal"></div>
<script>
const $=id=>document.getElementById(id);
let dreams=JSON.parse(localStorage.getItem('dreamcatcher')||'[]');
function save(){localStorage.setItem('dreamcatcher',JSON.stringify(dreams));}
const SYMBOLS=['water','flight','teeth','chase','falling','a door','an animal','school','an ex','being late','the moon','endless stairs'];
const FRAG1=['You are in a library where every book is blank','Your teeth politely resign, one by one','You can fly, but only at walking speed','The house you grew up in has a new room','You are late for an exam in a subject you invented','A whale swims past the office window','Everyone at the party is you at different ages','The elevator only goes sideways'];
const FRAG2=['and nobody else finds it strange','and the moon is taking notes','but the exit keeps moving','and your shoes are loudly wrong','while a small dog explains taxes','and the sky is the wrong texture','until you realize it was a Tuesday the whole time','but the door opens onto the same door'];
function symbolsOf(t){const l=t.toLowerCase();return SYMBOLS.filter(s=>l.includes(s));}
function render(){
 $('stats').innerHTML='DREAMS CAUGHT <b>'+dreams.length+'</b>';
 const el=$('journal');el.innerHTML='';
 dreams.forEach(d=>{
  const e=document.createElement('div');e.className='entry';
  e.innerHTML='<div class="when">'+d.when+'</div>'+d.text.replace(/</g,'&lt;')+(d.sym.length?'<div class="sym">symbols: '+d.sym.join(' &middot; ')+'</div>':'');
  el.appendChild(e);});
}
$('catch').onclick=()=>{
 const t=$('dream').value.trim();if(!t)return;
 dreams.unshift({text:t,when:new Date().toLocaleString(),sym:symbolsOf(t)});
 $('dream').value='';save();render();};
$('generate').onclick=()=>{
 const g=FRAG1[Math.floor(Math.random()*FRAG1.length)]+' '+FRAG2[Math.floor(Math.random()*FRAG2.length)]+'.';
 const d=$('generated');d.style.display='block';d.textContent='Tonight\'s forecast: '+g+' (catch it? it is yours now.)';
 $('dream').value=g;};
render();
</script>
</body>
</html>
